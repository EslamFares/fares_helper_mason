# Register bricks which can be consumed via the Mason CLI.
# Run "mason get" to install all registered bricks.
# To learn more, visit https://docs.brickhub.dev.
bricks:
  #*--------- local ----------------------------
  # feature:
  #   path: bricks/feature
  # featureEnumState:
  #   path: bricks/featureEnumState
  # featureMultiEnumState:
  #   path: bricks/featureMultiEnumState
  # featureMultiEnumStateSingle:
  #   path: bricks/featureMultiEnumStateSingle

  #*--------- Github ----------------------------
  feature:
    git:
      url: https://github.com/EslamFares/fares_helper_mason.git
      path: bricks/feature
  featureEnumState:
    git:
      url: https://github.com/EslamFares/fares_helper_mason.git
      path: bricks/featureEnumState
  featureMultiEnumState:
    git:
      url: https://github.com/EslamFares/fares_helper_mason.git
      path: bricks/featureMultiEnumState
  featureMultiEnumStateSingle:
    git:
      url: https://github.com/EslamFares/fares_helper_mason.git
      path: bricks/featureMultiEnumStateSingle
  #*--------- Use ----------------------------
#!| get(first)                            | make(last)                              |
# | mason get feature                     | mason make feature                      |
# | mason get featureEnumState            | mason make featureEnumState             |
# | mason get featureMultiEnumState       | mason make featureMultiEnumState        |
# | mason get featureMultiEnumStateSingle | mason make featureMultiEnumStateSingle  |

#*--------- Error Path ----------------------------
#! error path
# mason cache clear
#! delete data in line => mason-lock.json

#*--------- versions of mason used----------------------------
#  run ==> mason list

